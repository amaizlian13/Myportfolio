<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDE</title>

  <style>
  body{
    font-family: Times New Roman;
    margin: 0;
    background: white;
}
  
  .home{
    color: white;
  }
  
.navbar{
    display: flex;
    background-color: purple;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    gap: 20px;
}

.searchbar{
    width: 300px;
    border-radius: 20px;
    border: none;
    padding: 8px;
}

.dl-button{
    background: pink;
    color: white;
    border: 1px solid purple;
    padding: 10px;
}

.main{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50vh;
}

.card{
    border: 3px solid black;
    padding: 20px;
    width: 300px;
    background: white;
}

.card input{
    width: 94%;
    padding: 10px;
    margin: 10px auto;
    border: 1px solid black;
    background-color: lightgrey;
}

.buttons{
    display: flex;
    gap: 10px;
}

.request{
    background: pink;
    color: black;
    padding: 10px;
    border: none;
}

.sched{
    background: violet;
    padding: 10px;
    border: none;
}
  </style>
</head>

<body>

<div class="navbar">
    <div class="home">Home</div>
    <input type="text" placeholder="Search" class="searchbar">
    <button class="dl-button">Download</button>
</div>

<div class="main">
    <div class="card">
        <h2>Request a ride now</h2>
        <input type="text" placeholder="Enter pickup location">
        <input type="text" placeholder="Enter destination">

        <div class="buttons">
            <button class="request">Request now</button>
            <button class="sched">Schedule for later</button>
        </div>
    </div>
</div>

</body>
</html>
